# Optional: run PostgreSQL in Docker instead of installing it locally.
#   docker compose up -d
# Then use the default DATABASE_URL from .env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: khulna
      POSTGRES_PASSWORD: khulna_dev_password
      POSTGRES_DB: khulna_bites
    ports:
      - "5432:5432"
    volumes:
      - khulna_pgdata:/var/lib/postgresql/data

volumes:
  khulna_pgdata:
